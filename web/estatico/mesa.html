<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Trabajo · La Cueva del Economista</title>
<meta name="description" content="Plataforma de econometría de series de tiempo de Argentina: explorar series y la historia económica 1880 → hoy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/web/estilo/tokens.css">
<script src="/web/estilo/tema.js"></script>
<style>
  /* Mesa de la versión publicada: el cascarón de web/index.html sin proyectos ni agentes,
     que necesitan el servidor. El explorador va en iframe, igual que en la Mesa real. */
  body{margin:0; background:var(--surface); color:var(--ink); font-family:var(--sans)}
  .aviso{display:block; margin:0; border-radius:0; border-left:0; border-right:0; border-top:0; padding:7px 16px; font-size:12.5px}
  .aviso[hidden]{display:none}
  .mesa{flex:1; min-height:0; display:flex}
  .mesa iframe{flex:1; width:100%; border:0; background:#0b1220}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="glyph" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 21V13.5C3 7.7 7 3.5 12 3.5S21 7.7 21 13.5V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".38"/>
        <path d="M4.5 21l3.2-5.1 3 3.4 3.4-7.3 2.6 4.6 2.8-3.2" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="brand-name">La Cueva del <em>Economista</em></div>
    </div>

    <nav class="modswitch" aria-label="Módulos">
      <a href="/tiempo/">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 13h13M3 13V9.5M6.2 13V6M9.4 13V3.5M12.6 13V7.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Línea de Tiempo
      </a>
      <a href="/" aria-current="true">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.6" y="2.4" width="12.8" height="11.2" rx="1.8" stroke="currentColor" stroke-width="1.5"/><path d="M1.6 6.2h12.8M6.4 6.2v7.4" stroke="currentColor" stroke-width="1.5"/></svg>
        Mesa de Trabajo
      </a>
    </nav>

    <div class="topright">
      <span class="chip neutral" title="Sitio estático: se explora, no se ejecuta">versión publicada</span>
      <button class="iconbtn" id="tema" title="Cambiar tema" aria-label="Cambiar tema">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <p class="note info aviso">
    <b>Versión publicada.</b> Se pueden explorar, comparar y deflactar las series. El banco
    <b>⚗️ Estudio</b>, el Kalman, el análisis básico y los agentes corren en el servidor y acá no están.
  </p>
  <!--__AVISO_SIN_DATOS__-->

  <main class="mesa">
    <iframe src="/explorador/" title="Explorador de series"></iframe>
  </main>
</div>
<script>
  document.getElementById('tema').addEventListener('click', () => window.CuevaTema.alternar());
</script>
</body>
</html>
