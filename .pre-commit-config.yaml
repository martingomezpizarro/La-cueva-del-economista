# Hooks que corren ANTES de cada commit (instalar una vez: pre-commit install).
# Atajan formato, lint y —clave— secretos, antes de que lleguen al repo.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2000]   # nada pesado al repo (corpus/índice van ignorados)
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks   # detector de claves/API keys en el diff
